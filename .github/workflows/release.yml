name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o vpn-bot-linux-amd64 ./cmd/bot/
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o vpn-bot-linux-arm64 ./cmd/bot/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            vpn-bot-linux-amd64 \
            vpn-bot-linux-arm64 \
            --title "${{ github.ref_name }}" \
            --generate-notes
